[package]
name = "scred-proxy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Forward proxy with unified policy support (placeholder replacement + redaction)"

[dependencies]
scred-config = { path = "../scred-config" }
scred-http = { path = "../scred-http" }
scred-policy = { path = "../scred-policy" }
scred-redactor = { path = "../scred-redactor" }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = "0.25"
http = "1.0"
bytes = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }

[[bench]]
name = "throughput"
harness = false

[[bin]]
name = "scred-proxy"
path = "src/main.rs"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ['bytes', 'http']
