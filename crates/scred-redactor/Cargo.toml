[package]
name = "scred-redactor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core secret pattern redaction engine (244+ patterns)"

[dependencies]
# Pure Rust SIMD pattern detection (no Zig FFI)
scred-detector = { path = "../scred-detector" }
tokio = { workspace = true, features = ["io-util"] }
tracing = { workspace = true }



[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }



[[bench]]
name = "streaming_benchmark"
harness = false

[[bench]]
name = "phase1_benchmark"
harness = false

[[bench]]
name = "phase3_throughput"
harness = false

[[bench]]
name = "redaction_perf"
harness = false

[[bench]]
name = "engine_creation"
harness = false

[[bench]]
name = "pattern_timing"
harness = false

[[bench]]
name = "fastpath_test"
harness = false

[[bench]]
name = "task4_performance_baseline"
harness = false

[[bench]]
name = "detailed_profile"
harness = false

[[bench]]
name = "throughput"
harness = false

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ['bytes', 'http']
