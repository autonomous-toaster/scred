[package]
name = "scred"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Secret redaction CLI tool"

[dependencies]
scred-redactor = { path = "../scred-redactor" }
scred-http = { path = "../scred-http", features = ["redaction"] }
tracing = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "scred"
path = "src/main.rs"

[[bench]]
name = "streaming"
harness = false

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ['bytes', 'http']
